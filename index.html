    function Icon({ name, className = "w-4 h-4" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ref.current || !window.lucide) return;
        const iconDef = window.lucide.icons?.[name];
        if (!iconDef) return;
        const svg = window.lucide.createElement(iconDef);
        className.split(" ").filter(Boolean).forEach((c) => svg.classList.add(c));
        ref.current.innerHTML = "";
        ref.current.appendChild(svg);
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    }

    function speakWord(text, accent = "en-US", rate = 0.95) {
      if (!text || typeof window === "undefined" || !("speechSynthesis" in window)) return;
      const synth = window.speechSynthesis;
      if (synth.paused) synth.resume();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = accent;
      utter.rate = rate;
      const voices = cachedVoices.length ? cachedVoices : synth.getVoices();
      const prefix = accent.toLowerCase();
      const voice =
        voices.find((v) => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith(prefix)) ||
        voices.find((v) => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("en"));
      if (voice) utter.voice = voice;
      synth.speak(utter);
    }

    // --- GỌI GEMINI API THẬT ---
    async function callGeminiMentor({ apiKey, prompt, mode, level, userContext }) {
      const systemInstruction = [
        "You are an expert, supportive English mentor specifically for Vietnamese learners.",
        `Learner level: ${level}. Current mode: ${mode}.`,
        `Learner stats: ${userContext}.`,
        "Respond clearly in Vietnamese with natural English examples, IPA when helpful, concise grammar/vocabulary corrections, and practical next steps. Never use raw ** markdown asterisks; use plain text or bullet points."
      ].join(" ");

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(
        apiKey.trim()
      )}`;

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: systemInstruction }] },
          contents: [{ role: "user", parts: [{ text: prompt }] }]
        })
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData?.error?.message || `API Error (${res.status})`);
      }

      const data = await res.json();
      const text =
        data?.candidates?.[0]?.content?.parts?.map((p) => p.text).join("\n").trim() ||
        "Không nhận được nội dung phản hồi từ Gemini.";
      return text.replace(/\*\*/g, "");
    }

                  intervalDays: nextInterval,
                  dueAt: Date.now() + nextInterval * 86400000

          const item = source[i % source.length];
          const distractors = vocabList
            .filter((x) => x.id !== item.id)
            .slice(0, 3)
            .map((x) => x.vi);
          while (distractors.length < 3) distractors.push("Nghĩa khác trong ngữ cảnh");
          const options = [...distractors];
          const correctPos = i % 4;
          options.splice(correctPos, 0, item.vi);

          const typeLabel =
            i % 3 === 0
              ? "English-to-Vietnamese"
              : i % 3 === 1
              ? "Context Vocabulary"
              : "Sentence Completion";

          qs.push({
            id: `qq-${i}`,
            type: typeLabel,
            prompt:
              i % 3 === 0
                ? `Từ "${item.word}" (${item.pos}, ${item.ipaUS}) có nghĩa tiếng Việt là gì?`
                : `Điền nghĩa phù hợp cho từ "${item.word}" trong câu: "${item.example}"`,
            options,
            correctIndex: correctPos,
            explanation: `"${item.word}" nghĩa là "${item.vi}" (${item.def}). Ví dụ: ${item.example}`
          });
        }
        setQuizQuestions(qs);
        setQIdx(0);
        setSelectedAns({});
        setQuizFinished(false);
        setQuizStarted(true);
      };

      const finishQuiz = () => {
        const correctCount = quizQuestions.filter((q, idx) => selectedAns[idx] === q.correctIndex).length;
        const scorePct = quizQuestions.length ? Math.round((correctCount / quizQuestions.length) * 100) : 0;
        setQuizFinished(true);
        setStats((prev) => ({
          ...prev,
          xp: prev.xp + correctCount * 15,
          minutes: prev.minutes + 8,
          quizHistory: [
            {
              id: "qh-" + Date.now(),
              topic: `${quizTopic} (${quizDifficulty})`,
              score: scorePct,
              total: quizQuestions.length,
              correct: correctCount,
              date: "Hôm nay"
            },
            ...prev.quizHistory
          ]
        }));
        notify(`Hoàn thành Quiz: ${correctCount}/${quizQuestions.length} (${scorePct}%)`);
      };

      // --- GRAMMAR MINI QUIZ STATE ---
      const [grammarAns, setGrammarAns] = useState({});

      // --- PRONUNCIATION SPEECH STATE ---
      const [pronIdx, setPronIdx] = useState(0);
      const [isListeningMic, setIsListeningMic] = useState(false);
      const [micFeedback, setMicFeedback] = useState("");
      const micRef = useRef(null);
      const activePron = PRONUNCIATION_ITEMS[pronIdx % PRONUNCIATION_ITEMS.length];

      const handlePronRecord = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          setMicFeedback(`Trình duyệt hiện tại không hỗ trợ SpeechRecognition. Bạn đã nghe mẫu "${activePron.word}".`);
          recordActivity(`Luyện phát âm "${activePron.word}"`, 10, 3);
          return;
        }
        if (isListeningMic && micRef.current) {
          micRef.current.stop();
          setIsListeningMic(false);
          return;
        }
        const rec = new SR();
        rec.lang = profile.accent;
        micRef.current = rec;
        setIsListeningMic(true);
        setMicFeedback("");
        rec.onresult = (e) => {
          const heard = e.results[0][0].transcript;
          const match = heard.toLowerCase().includes(activePron.word.toLowerCase());
          setMicFeedback(
            match
              ? `Rất tốt! Hệ thống nghe được "${heard}" khớp với "${activePron.word}".`
              : `Hệ thống nghe được "${heard}". Hãy chú ý: ${activePron.tip}`
          );
          recordActivity(`Ghi âm luyện phát âm "${activePron.word}"`, 15, 3);
        };
        rec.onerror = () => {
          setIsListeningMic(false);
          setMicFeedback("Không truy cập được micro hoặc chưa cấp quyền trên trình duyệt.");
        };
        rec.onend = () => setIsListeningMic(false);
        rec.start();
      };

      // --- AI MENTOR STATE ---
      const [mentorMode, setMentorMode] = useState("Conversation Practice");
      const [mentorPrompt, setMentorPrompt] = useState("");
      const [mentorLoading, setMentorLoading] = useState(false);
      const [mentorError, setMentorError] = useState("");
      const [chatLog, setChatLog] = useState([
        {
          role: "assistant",
          mode: "Conversation Practice",
          text: "Xin chào! Mình là AI Mentor của EngViet Studio. Hãy nhập Gemini API key ở mục AI Mentor hoặc Cài đặt để kết nối AI thật, sau đó đặt câu hỏi, nhờ sửa ngữ pháp, luyện IELTS hoặc hội thoại song ngữ Việt - Anh nhé."
        }
      ]);

      const handleSendMentor = async (customText) => {
        const text = (typeof customText === "string" ? customText : mentorPrompt).trim();
        if (!text) return;
        setMentorError("");
        setChatLog((prev) => [...prev, { role: "user", mode: mentorMode, text }]);

          );
          return;

        setMentorLoading(true);
        try {
          const reply = await callGeminiMentor({
            apiKey: profile.geminiApiKey,
            prompt: text,
            mode: mentorMode,
            level: profile.level,
            userContext: `XP=${stats.xp}, LearnedWords=${vocabList.filter((w) => w.learned).length}/${vocabList.length}`

          setChatLog((prev) => [...prev, { role: "assistant", mode: mentorMode, text: reply }]);

                            : dark
                            ? "bg-[#111833] border-slate-700 text-slate-300"
                            : "bg-white border-purple-100 text-slate-700"
                        }`}
                      >
                        {m}
                      </button>
                    ))}
                  </div>

                  {/* Quick Starters */}
                  <div className="flex flex-wrap gap-2">
                    {[
                      "Sửa giúp câu: Although I was tired, but I still finished my report.",
                      "Cho 3 collocations IELTS Band 7+ về chủ đề environment và ví dụ.",
                      "Đặt 1 câu hỏi hội thoại tiếng Anh chủ đề học tập và giải thích từ khó."
                    ].map((sampleQ, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => handleSendMentor(sampleQ)}
                        className="text-xs px-3 py-1.5 rounded-xl bg-purple-100 text-violet-800 font-semibold hover:bg-purple-200"
                      >
                        {sampleQ}
                      </button>
                    ))}
                  </div>

                  {mentorError && (
                    <div className="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-xs font-semibold text-rose-700">
                      {mentorError}
                    </div>
                  )}

                  {/* Chat History */}
                  <div
                    className={`p-4 rounded-2xl border max-h-[380px] overflow-y-auto space-y-3 ${
                      dark ? "bg-[#111833] border-slate-800" : "bg-white border-purple-100"
                    }`}
                  >
                    {chatLog.map((msg, idx) => (
                      <div
                        key={idx}
                        className={`p-3.5 rounded-2xl text-xs sm:text-sm whitespace-pre-line leading-relaxed ${
                          msg.role === "user"
                            ? "bg-violet-600 text-white ml-auto max-w-[82%]"
                            : dark
                            ? "bg-[#0b1021] text-slate-100 mr-auto max-w-[88%] border border-slate-800"
                            : "bg-[#f6f5ff] text-slate-900 mr-auto max-w-[88%] border border-purple-100"
                        }`}
                      >
                        <div className="text-[10px] opacity-70 font-bold mb-1">{msg.mode}</div>
                        {msg.text}
                      </div>
                    ))}
                    {mentorLoading && (
                      <div className="text-xs font-bold text-violet-600">AI Mentor đang phản hồi...</div>
                    )}
                  </div>

                  {/* Input */}
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={mentorPrompt}
                      onChange={(e) => setMentorPrompt(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && handleSendMentor()}
                      placeholder="Nhập câu hỏi, đoạn văn hoặc câu tiếng Anh cần sửa..."
                      className="flex-1 px-4 py-3 rounded-2xl border border-slate-300 text-xs sm:text-sm text-slate-900 bg-white"
                    />
                    <button
                      type="button"
                      disabled={mentorLoading}
                      onClick={() => handleSendMentor()}
                      className="px-5 py-3 rounded-2xl bg-violet-600 hover:bg-violet-700 disabled:opacity-50 text-white text-xs sm:text-sm font-bold"
                    >
                      Gửi
                    </button>
                  </div>
                </div>
              )}

              {/* 7. PRONUNCIATION */}
              {page === "pronunciation" && (
                <div className="max-w-2xl mx-auto space-y-5">
                  <div className="flex items-center justify-between">
                    <h2 className="text-2xl font-extrabold">Pronunciation Lab</h2>
                    <button
                      type="button"
                      onClick={() => {
                        setPronIdx((i) => i + 1);
                        setMicFeedback("");
                      }}
                      className="px-3.5 py-2 rounded-xl bg-violet-600 text-white text-xs font-bold"
                    >
                      Từ tiếp theo →
                    </button>
                  </div>

                  <div
                    className={`p-6 rounded-2xl border space-y-4 ${
                      dark ? "bg-[#111833] border-slate-800" : "bg-white border-purple-100"
                    }`}
                  >
                    <div className="text-3xl font-extrabold text-violet-600">{activePron.word}</div>
                    <div className="text-xs space-y-1">
                      <div>
                        <strong>UK:</strong> {activePron.ipaUK} · <strong>US:</strong> {activePron.ipaUS}
                      </div>
                      <div>
                        <strong>Word Stress:</strong> {activePron.stress}
                      </div>
                      <div>
                        <strong>Minimal Pair:</strong> {activePron.minimalPair}
                      </div>
                    </div>
                    <p className="text-xs p-3.5 rounded-xl bg-purple-500/5 border border-purple-500/15">
                      <strong>Mẹo phát âm:</strong> {activePron.tip}
                    </p>

                    <div className="flex flex-wrap gap-2.5">
                      <button
                        type="button"
                        onClick={() => speakWord(activePron.word, "en-GB", 0.9)}
                        className="px-4 py-2 rounded-xl bg-purple-100 text-violet-800 text-xs font-bold"
                      >
                        Nghe UK
                      </button>
                      <button
                        type="button"
                        onClick={() => speakWord(activePron.word, "en-US", 0.9)}
                        className="px-4 py-2 rounded-xl bg-purple-100 text-violet-800 text-xs font-bold"
                      >
                        Nghe US
                      </button>
                      <button
                        type="button"
                        onClick={handlePronRecord}
                        className={`px-4 py-2 rounded-xl text-white text-xs font-bold ${
                          isListeningMic ? "bg-rose-600" : "bg-violet-600 hover:bg-violet-700"
                        }`}
                      >
                        {isListeningMic ? "Đang nghe giọng nói..." : "Ghi âm luyện đọc"}
                      </button>
                    </div>

                    {micFeedback && (
                      <div className="p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-xs font-semibold">
                        {micFeedback}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* 8. LEARNING PROGRESS */}
              {page === "progress" && (
                <div className="space-y-5">
                  <h2 className="text-2xl font-extrabold">Learning Progress & Analytics</h2>
                  <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {[
                      { label: "Total Words Learned", val: learnedCount },
                      { label: "Total Vocabulary", val: vocabList.length },
                      { label: "Study Time", val: `${stats.minutes} phút` },
                      { label: "Average Quiz Score", val: `${avgQuizScore}%` }
                    ].map((s, i) => (
                      <div
                        key={i}
                        className={`p-5 rounded-2xl border ${
                          dark ? "bg-[#111833] border-slate-800" : "bg-white border-purple-100"
                        }`}
                      >
                        <div className="text-xs text-slate-500 font-semibold">{s.label}</div>
                        <div className="text-2xl font-extrabold text-violet-600 mt-1">{s.val}</div>
                      </div>
                    ))}
                  </div>

                  <div
                    className={`p-6 rounded-2xl border space-y-2 ${
                      dark ? "bg-[#111833] border-slate-800" : "bg-white border-purple-100"
                    }`}
                  >
                    <h3 className="font-extrabold text-sm">Khuyến nghị cá nhân hóa</h3>
                    <p className="text-xs text-slate-500 leading-relaxed">
                      • Bạn đang có {vocabList.length - learnedCount} từ chưa đánh dấu đã học — hãy dùng tab Flashcards (Again/Hard/Good/Easy) để tăng độ ghi nhớ.
                      <br />• Điểm Quiz trung bình hiện tại là {avgQuizScore}%. Hãy luyện thêm Quiz theo chủ đề trước kỳ kiểm tra.
                    </p>
                  </div>
                </div>
              )}

              {/* 9. SETTINGS */}
              {page === "settings" && (
                <div className="max-w-2xl space-y-5">
                  <h2 className="text-2xl font-extrabold">Settings & Profile</h2>
                  <div
                    className={`p-6 rounded-2xl border space-y-4 ${
                      dark ? "bg-[#111833] border-slate-800" : "bg-white border-purple-100"
                    }`}
                  >
                    <div>
                      <label className="block text-xs font-bold mb-1">Tên hiển thị</label>
                      <input
                        type="text"
                        value={profile.name}
                        onChange={(e) => setProfile({ ...profile, name: e.target.value })}
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm text-slate-900 bg-white"
                      />
                    </div>

                    <div className="grid sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold mb-1">Trình độ tiếng Anh</label>
                        <select
                          value={profile.level}
                          onChange={(e) => setProfile({ ...profile, level: e.target.value })}
                          className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm text-slate-900 bg-white"
                        >
                          {["A2 (Elementary)", "B1 (Intermediate)", "B2 (Upper-Intermediate)", "C1 (Advanced)"].map(
                            (lv) => (
                              <option key={lv} value={lv}>
                                {lv}
                              </option>
                            )
                          )}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-bold mb-1">Giọng phát âm ưu tiên</label>
                        <select
                          value={profile.accent}
                          onChange={(e) => setProfile({ ...profile, accent: e.target.value })}
                          className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm text-slate-900 bg-white"
                        >
                          <option value="en-US">American English (en-US)</option>
                          <option value="en-GB">British English (en-GB)</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold mb-1">Mục tiêu XP mỗi ngày</label>
                      <input
                        type="number"
                        min={20}
                        max={1000}
                        step={10}
                        value={profile.dailyGoalXp}
                        onChange={(e) => setProfile({ ...profile, dailyGoalXp: Number(e.target.value) || 100 })}
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm text-slate-900 bg-white"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold mb-1">Gemini API Key (AI Mentor)</label>
                      <input
                        type="password"
                        value={profile.geminiApiKey}
                        onChange={(e) => setProfile({ ...profile, geminiApiKey: e.target.value })}
                        placeholder="Nhập Gemini API Key"
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm text-slate-900 bg-white"
                      />
                    </div>

                    <div className="flex flex-wrap gap-3 pt-2">
                      <button
                        type="button"
                        onClick={() => setProfile({ ...profile, darkMode: !profile.darkMode })}
                        className="px-4 py-2 rounded-xl bg-violet-600 text-white text-xs font-bold"
                      >
                        Chế độ: {profile.darkMode ? "Dark Mode" : "Light Mode"}
                      </button>
                      <button
                        type="button"
                        onClick={() => setProfile({ ...profile, notifications: !profile.notifications })}
                        className="px-4 py-2 rounded-xl bg-purple-100 text-violet-800 text-xs font-bold"
                      >
                        Thông báo: {profile.notifications ? "Bật" : "Tắt"}
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          localStorage.removeItem("engviet_vocab_v3");
                          localStorage.removeItem("engviet_stats_v3");
                          setVocabList(INITIAL_VOCAB);
                          notify("Đã đặt lại dữ liệu mẫu.");
                        }}
                        className="px-4 py-2 rounded-xl bg-rose-100 text-rose-800 text-xs font-bold"
                      >
                        Reset dữ liệu học
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>

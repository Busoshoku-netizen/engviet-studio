    let cachedVoices = [];
    if (typeof window !== "undefined" && "speechSynthesis" in window) {
      const loadVoices = () => {
        cachedVoices = window.speechSynthesis.getVoices() || [];
      };
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;

    function speakText(text, rate = 1.0) {
      if (!text || typeof window === "undefined" || !("speechSynthesis" in window)) return;
      const synth = window.speechSynthesis;
      if (synth.paused) synth.resume();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = rate;
      utter.volume = 1.0;

      const voices = cachedVoices.length ? cachedVoices : synth.getVoices();
      const englishVoice =
        voices.find((v) => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("en-us")) ||
        voices.find((v) => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("en"));

      if (englishVoice) utter.voice = englishVoice;
      synth.speak(utter);
    }

    // --- PHÂN TÍCH LỖI VIETLISH ---
    function analyzeVietlish(text) {
      const issues = [];
      const lower = text.toLowerCase();
      if (/\bvery like\b/.test(lower)) {
        issues.push({
          bad: "very like",
          fix: "really like / love",
          reason: "Không dùng 'very' đứng trước động từ 'like' (dịch sát nghĩa 'rất thích')."
        });
      }
      if (/\balthough\b/.test(lower) && /\bbut\b/.test(lower)) {
        issues.push({
          bad: "although ... but ...",
          fix: "dùng 'although' HOẶC 'but', không dùng cả hai",
          reason: "Trong tiếng Anh, 'although' và 'but' không đi cùng nhau trong một cặp mệnh đề."
        });
      }
      if (/\bhave \d+ years? old\b/.test(lower)) {
        issues.push({
          bad: "have ... years old",
          fix: "am / is / are ... years old",
          reason: "Tuổi tác trong tiếng Anh dùng động từ 'to be' (am/is/are), không dùng 'have'."
        });
      }
      if (/\bmore better\b|\bmore easier\b/.test(lower)) {
        issues.push({
          bad: "more better / more easier",
          fix: "better / easier",
          reason: "Tránh so sánh kép (dùng cả 'more' và tính từ so sánh hơn)."
        });
      }
      return issues;
    }

    // --- PHẢN HỒI CỦA AI MENTOR TÍCH HỢP ---
    function generateMentorReply(input) {
      const trimmed = input.trim();
      const matchedPreset = MENTOR_PRESETS.find(
        (p) => p.q.toLowerCase().includes(trimmed.toLowerCase()) || trimmed.toLowerCase().includes(p.q.toLowerCase().slice(0, 12))
      );
      if (matchedPreset) return matchedPreset.a;

      const issues = analyzeVietlish(trimmed);
      if (issues.length > 0) {
        return issues
          .map((it) => `Mình thấy cụm **"${it.bad}"** -> nên đổi thành **"${it.fix}"**. Lý do: ${it.reason}`)
          .join("\n\n");
      }

      return `Gợi ý cho câu/từ **"${trimmed}"**:\n• Nếu bạn muốn diễn đạt tự nhiên hơn, hãy đặt câu ngắn gọn với chủ ngữ + động từ chính + tân ngữ.\n• Bạn có thể bấm nút **Nghe mẫu** hoặc chuyển sang tab **Viết / Nói** để luyện phản xạ trực tiếp (+10 XP).`;
    }

          gainXp(10);

        if (typeof customText !== "string") setMentorInput("");

        const target = SPEAKING_PROMPTS[speakIdx];

        if (!SpeechRec) {
          setSpokenResult(target.phrase);
          setSpeakScore(88);
          gainXp(15);
          return;
        }

        if (isRecording && recognitionRef.current) {
          recognitionRef.current.stop();
          setIsRecording(false);
          return;
        }

        const rec = new SpeechRec();
        rec.lang = "en-US";
        rec.interimResults = false;
        recognitionRef.current = rec;
        setIsRecording(true);
        setSpokenResult("");
        setSpeakScore(null);

        rec.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          setSpokenResult(transcript);

          const targetWords = target.phrase.toLowerCase().replace(/[^a-z\s]/g, "").split(/\s+/);
          const saidWords = new Set(transcript.toLowerCase().replace(/[^a-z\s]/g, "").split(/\s+/));
          const matched = targetWords.filter((w) => saidWords.has(w)).length;
          const score = Math.min(100, Math.max(45, Math.round((matched / targetWords.length) * 100)));
          setSpeakScore(score);
          gainXp(15);
        };

        rec.onerror = () => {
          setIsRecording(false);
          setSpokenResult("Không nhận diện được giọng nói (hãy kiểm tra quyền Micro hoặc thử lại).");

        rec.start();

                    <button
                      onClick={() => toggleSaveWord(selectedToken)}
                      className="px-3 py-1.5 rounded-lg bg-white border border-indigo-200 text-xs font-semibold text-indigo-700"
                    >
                      ★ Lưu vào sổ từ
                    </button>
                  </div>
                )}

                {showBilingual && (
                  <div className="p-4 rounded-xl bg-emerald-50/70 border border-emerald-200 text-sm text-emerald-950">
                    <strong>Bản dịch:</strong> {READING_PASSAGES[0].viFull}
                  </div>
                )}

                <div className="pt-2 border-t border-slate-200 space-y-2.5">
                  <p className="text-sm font-bold text-slate-900">{READING_PASSAGES[0].question}</p>
                  <div className="space-y-2">
                    {READING_PASSAGES[0].options.map((opt, idx) => {
                      const chosen = readingChoice === idx;
                      const isCorrect = idx === READING_PASSAGES[0].correctIndex;
                      return (
                        <button
                          key={idx}
                          onClick={() => {
                            if (readingChoice === null) gainXp(10);
                            setReadingChoice(idx);
                          }}
                          className={`w-full text-left px-4 py-2.5 rounded-xl border text-sm font-medium transition ${
                            chosen
                              ? isCorrect
                                ? "bg-emerald-50 border-emerald-500 text-emerald-900"
                                : "bg-rose-50 border-rose-500 text-rose-900"
                              : "bg-white border-slate-200 hover:bg-slate-50"
                          }`}
                        >
                          {opt}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* 7. WRITING */}
            {activeTab === "writing" && (
              <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-5">
                <div>
                  <span className="text-xs font-semibold uppercase tracking-wider text-indigo-600">
                    Luyện viết & tránh lỗi Vietlish
                  </span>
                  <h2 className="text-xl font-bold text-slate-900 mt-1">{WRITING_PROMPTS[0].title}</h2>
                </div>

                <div className="flex flex-wrap gap-2">
                  {WRITING_PROMPTS[0].starters.map((st, idx) => (
                    <button
                      key={idx}
                      onClick={() => setWritingText((prev) => (prev ? `${prev} ${st}` : st))}
                      className="text-xs px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium"
                    >
                      + "{st}"
                    </button>
                  ))}
                </div>

                <textarea
                  rows={5}
                  value={writingText}
                  onChange={(e) => setWritingText(e.target.value)}
                  placeholder="Viết đoạn tiếng Anh của bạn tại đây..."
                  className="w-full rounded-xl border border-slate-300 p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />

                <div className="flex items-center justify-between text-xs text-slate-500">
                  <span>Số từ: <strong>{wordCount}</strong></span>
                  <button
                    onClick={() => setWritingText(WRITING_PROMPTS[0].sample)}
                    className="text-indigo-600 font-semibold hover:underline"
                  >
                    Chèn đoạn mẫu tham khảo
                  </button>
                </div>

                {vietlishIssues.length > 0 && (
                  <div className="space-y-2">
                    <div className="text-xs font-bold uppercase tracking-wider text-amber-700">
                      Gợi ý chỉnh lỗi diễn đạt kiểu tiếng Việt (Vietlish):
                    </div>
                    {vietlishIssues.map((issue, idx) => (
                      <div key={idx} className="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-xs space-y-1">
                        <div className="font-bold text-amber-950">
                          Phát hiện "{issue.bad}" → Nên dùng: <span className="text-emerald-800">{issue.fix}</span>
                        </div>
                        <p className="text-amber-900">{issue.reason}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>

    let cachedVoices = [];
    if (typeof window !== "undefined" && "speechSynthesis" in window) {
      const loadVoices = () => {
        cachedVoices = window.speechSynthesis.getVoices() || [];
      };
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakText(text, rate = 1.0) {
      if (!text || typeof window === "undefined" || !("speechSynthesis" in window)) return;
      const synth = window.speechSynthesis;
      if (synth.paused) synth.resume();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = rate;
      utter.volume = 1.0;

      const voices = cachedVoices.length ? cachedVoices : synth.getVoices();
      const englishVoice =
        voices.find((v) => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("en-us")) ||
        voices.find((v) => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("en"));

      if (englishVoice) utter.voice = englishVoice;
      synth.speak(utter);
    }

    // --- PHÂN TÍCH LỖI VIETLISH ---
    function analyzeVietlish(text) {
      const issues = [];
      const lower = text.toLowerCase();
      if (/\bvery like\b/.test(lower)) {
        issues.push({
          bad: "very like",
          fix: "really like / love",
          reason: "Không dùng 'very' đứng trước động từ 'like' (dịch sát nghĩa 'rất thích')."
        });
      }
      if (/\balthough\b/.test(lower) && /\bbut\b/.test(lower)) {
        issues.push({
          bad: "although ... but ...",
          fix: "dùng 'although' HOẶC 'but', không dùng cả hai",
          reason: "Trong tiếng Anh, 'although' và 'but' không đi cùng nhau trong một cặp mệnh đề."
        });
      }
      if (/\bhave \d+ years? old\b/.test(lower)) {
        issues.push({
          bad: "have ... years old",
          fix: "am / is / are ... years old",
          reason: "Tuổi tác trong tiếng Anh dùng động từ 'to be' (am/is/are), không dùng 'have'."
        });
      }
      if (/\bmore better\b|\bmore easier\b/.test(lower)) {
        issues.push({
          bad: "more better / more easier",
          fix: "better / easier",
          reason: "Tránh so sánh kép (dùng cả 'more' và tính từ so sánh hơn)."
        });
      }
      return issues;
    }

    // --- PHẢN HỒI CỦA AI MENTOR (KHÔNG DÙNG KÝ TỰ ** THÔ) ---
    function generateMentorReply(input) {
      const trimmed = input.trim();
      const matchedPreset = MENTOR_PRESETS.find(
        (p) =>
          p.q.toLowerCase().includes(trimmed.toLowerCase()) ||
          trimmed.toLowerCase().includes(p.q.toLowerCase().slice(0, 12))
      );
      if (matchedPreset) return matchedPreset.a;

      const issues = analyzeVietlish(trimmed);
      if (issues.length > 0) {
        return issues
          .map(
            (it) =>
              `Mình thấy cụm "${it.bad}" -> nên đổi thành "${it.fix}". Lý do: ${it.reason}`
          )
          .join("\n\n");
      }

      const cleanWord = trimmed.replace(/^["']+|["']+$/g, "");
      return `Gợi ý nhanh cho "${cleanWord}":\n• Hãy đặt từ/cụm này vào một câu ngắn gọn có chủ ngữ + động từ chính + tân ngữ để nhớ ngữ cảnh tự nhiên.\n• Bạn có thể bấm nút Nghe phát âm ở các tab Từ vựng, Nghe hoặc Nói để luyện phản xạ trực tiếp (+10 XP).`;
    }

        }

      const gainXp = (amount) => setXp((prev) => prev + amount);

      const toggleSaveWord = (item) => {

          if (exists) return prev.filter((w) => w.word.toLowerCase() !== item.word.toLowerCase());
          gainXp(10);
          return [...prev, { word: item.word, meaning: item.meaning }];
        });
      };

      const sendMentorMessage = (customText) => {
        const textToSend = (typeof customText === "string" ? customText : mentorInput).trim();
        if (!textToSend) return;
        const reply = generateMentorReply(textToSend);
        setMentorMessages((prev) => [
          ...prev,
          { role: "user", text: textToSend },
          { role: "mentor", text: reply }
        ]);
        if (typeof customText !== "string") setMentorInput("");
        gainXp(10);
      };

      const currentDeck = VOCAB_DECKS[deckName];
      const currentCard = currentDeck[cardIndex % currentDeck.length];

      const handleRecord = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const target = SPEAKING_PROMPTS[speakIdx];

        if (!SpeechRec) {
          setSpokenResult(target.phrase);
          setSpeakScore(88);
          gainXp(15);
          return;
        }

        if (isRecording && recognitionRef.current) {
          recognitionRef.current.stop();
          setIsRecording(false);
          return;
        }

        const rec = new SpeechRec();
        rec.lang = "en-US";
        rec.interimResults = false;
        recognitionRef.current = rec;
        setIsRecording(true);
        setSpokenResult("");
        setSpeakScore(null);

        rec.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          setSpokenResult(transcript);

          const targetWords = target.phrase.toLowerCase().replace(/[^a-z\s]/g, "").split(/\s+/);
          const saidWords = new Set(transcript.toLowerCase().replace(/[^a-z\s]/g, "").split(/\s+/));
          const matched = targetWords.filter((w) => saidWords.has(w)).length;
          const score = Math.min(100, Math.max(45, Math.round((matched / targetWords.length) * 100)));
          setSpeakScore(score);
          gainXp(15);
        };

        rec.onerror = () => {
          setIsRecording(false);
          setSpokenResult("Không nhận diện được giọng nói (hãy kiểm tra quyền Micro hoặc thử lại).");
        };

                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700">
                    Luyện phát âm & âm cuối
                  </span>
                  <button
                    type="button"
                    onClick={() => {
                      setSpeakIdx((prev) => (prev + 1) % SPEAKING_PROMPTS.length);
                      setSpokenResult("");
                      setSpeakScore(null);
                    }}
                    className="text-xs font-bold px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200"
                  >
                    Câu tiếp theo →
                  </button>
                </div>

                <div className="p-5 rounded-2xl bg-slate-50 border border-slate-200/80">
                  <p className="text-2xl sm:text-3xl font-extrabold text-slate-900">
                    "{SPEAKING_PROMPTS[speakIdx].phrase}"
                  </p>
                  <p className="text-sm text-slate-600 mt-1.5 font-medium">
                    {SPEAKING_PROMPTS[speakIdx].vi}
                  </p>
                  <p className="text-xs text-indigo-800 bg-indigo-50 border border-indigo-100 inline-block px-3.5 py-2 rounded-xl mt-3 font-semibold">
                    💡 Lưu ý phát âm: {SPEAKING_PROMPTS[speakIdx].tip}
                  </p>
                </div>

                <div className="flex flex-wrap gap-3">
                  <button
                    type="button"
                    onClick={() => speakText(SPEAKING_PROMPTS[speakIdx].phrase, 0.9)}
                    className="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-sm font-bold"
                  >
                    🔊 Nghe mẫu
                  </button>
                  <button
                    type="button"
                    onClick={handleRecord}
                    className={`px-5 py-2.5 rounded-xl text-white text-sm font-bold transition ${
                      isRecording ? "bg-rose-600 hover:bg-rose-700" : "bg-indigo-600 hover:bg-indigo-700"
                    }`}
                  >
                    {isRecording ? "⏹ Đang thu âm... (Bấm để dừng)" : "🎤 Bấm để nói thử"}
                  </button>
                </div>

                {spokenResult && (
                  <div className="p-4 rounded-2xl border border-slate-200 bg-slate-50 space-y-1">
                    <div className="text-xs text-slate-500 font-semibold">Hệ thống nhận diện:</div>
                    <div className="text-sm font-bold text-slate-900">"{spokenResult}"</div>
                    {speakScore !== null && (
                      <div className="text-sm font-extrabold text-emerald-700 pt-1">
                        Độ khớp ước lượng: {speakScore}% (+15 XP)
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* 6. ĐỌC */}
            {activeTab === "reading" && (
              <div className="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-xs space-y-5">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <span className="text-xs font-bold px-3 py-1 rounded-full bg-indigo-50 text-indigo-700">
                      {READING_PASSAGES[0].level}
                    </span>
                    <h2 className="text-2xl font-extrabold text-slate-900 mt-2">
                      {READING_PASSAGES[0].title}
                    </h2>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowBilingual(!showBilingual)}
                    className="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold hover:bg-slate-50"
                  >
                    {showBilingual ? "Ẩn bản dịch Việt" : "Hiện bản dịch Việt"}
                  </button>
                </div>

                <p className="text-xs text-slate-500 font-medium">
                  Chạm vào từng từ tiếng Anh để xem phiên âm IPA, nghe đọc và xem nghĩa tiếng Việt:
                </p>

                <div className="flex flex-wrap gap-x-1.5 gap-y-2 text-lg leading-relaxed p-5 rounded-2xl bg-slate-50 border border-slate-200/80">
                  {READING_PASSAGES[0].tokens.map((tok, i) => (
                    <button
                      key={i}
                      type="button"
                      onClick={() => {
                        setSelectedToken(tok);
                        speakText(tok.word);
                      }}
                      className={`px-1.5 py-0.5 rounded-lg transition font-medium ${
                        selectedToken?.text === tok.text
                          ? "bg-indigo-600 text-white"
                          : "hover:bg-indigo-100 text-slate-900"
                      }`}
                    >
                      {tok.text}
                    </button>
                  ))}
                </div>

                {selectedToken && (
                  <div className="p-4 rounded-2xl bg-indigo-50 border border-indigo-200 flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <span className="font-extrabold text-slate-900">{selectedToken.word}</span>{" "}
                      <span className="text-xs text-slate-600 font-medium">{selectedToken.ipa}</span>
                      <p className="text-sm text-indigo-950 font-semibold mt-0.5">
                        {selectedToken.meaning}
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => toggleSaveWord(selectedToken)}
                      className="px-3.5 py-2 rounded-xl bg-white border border-indigo-200 text-xs font-bold text-indigo-700"
                    >
                      ★ Lưu vào sổ từ
                    </button>
                  </div>
                )}

                {showBilingual && (
                  <div className="p-4 rounded-2xl bg-emerald-50/80 border border-emerald-200 text-sm text-emerald-950">
                    <strong>Bản dịch:</strong> {READING_PASSAGES[0].viFull}
                  </div>
                )}

                <div className="pt-3 border-t border-slate-200 space-y-2.5">
                  <p className="text-sm font-extrabold text-slate-900">
                    {READING_PASSAGES[0].question}
                  </p>
                  <div className="space-y-2">
                    {READING_PASSAGES[0].options.map((opt, idx) => {
                      const chosen = readingChoice === idx;
                      const isCorrect = idx === READING_PASSAGES[0].correctIndex;
                      return (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => {
                            if (readingChoice === null) gainXp(10);
                            setReadingChoice(idx);
                          }}
                          className={`w-full text-left px-4 py-3 rounded-2xl border text-sm font-semibold transition ${
                            chosen
                              ? isCorrect
                                ? "bg-emerald-50 border-emerald-500 text-emerald-900"
                                : "bg-rose-50 border-rose-500 text-rose-900"
                              : "bg-white border-slate-200 hover:bg-slate-50"
                          }`}
                        >
                          {opt}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* 7. VIẾT */}
            {activeTab === "writing" && (
              <div className="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-xs space-y-5">
                <div>
                  <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700">
                    Luyện viết & tránh lỗi Vietlish
                  </span>
                  <h2 className="text-2xl font-extrabold text-slate-900 mt-2">
                    {WRITING_PROMPTS[0].title}
                  </h2>
                </div>

                <div className="flex flex-wrap gap-2">
                  {WRITING_PROMPTS[0].starters.map((st, idx) => (
                    <button
                      key={idx}
                      type="button"
                      onClick={() => setWritingText((prev) => (prev ? `${prev} ${st}` : st))}
                      className="text-xs px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold"
                    >
                      + "{st}"
                    </button>
                  ))}
                </div>

                <textarea
                  rows={5}
                  value={writingText}
                  onChange={(e) => setWritingText(e.target.value)}
                  placeholder="Viết đoạn tiếng Anh của bạn tại đây..."
                  className="w-full rounded-2xl border border-slate-300 p-4 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />

                <div className="flex items-center justify-between text-xs text-slate-500 font-semibold">
                  <span>Số từ: {wordCount}</span>
                  <button
                    type="button"
                    onClick={() => setWritingText(WRITING_PROMPTS[0].sample)}
                    className="text-indigo-600 font-bold hover:underline"
                  >
                    Chèn đoạn mẫu tham khảo
                  </button>
                </div>

                {vietlishIssues.length > 0 && (
                  <div className="space-y-2">
                    <div className="text-xs font-bold uppercase tracking-wider text-amber-700">
                      Gợi ý chỉnh lỗi diễn đạt kiểu tiếng Việt (Vietlish):
                    </div>
                    {vietlishIssues.map((issue, idx) => (
                      <div
                        key={idx}
                        className="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs sm:text-sm space-y-1"
                      >
                        <div className="font-bold text-amber-950">
                          Phát hiện "{issue.bad}" → Nên dùng: {issue.fix}
                        </div>
                        <p className="text-amber-900">{issue.reason}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
